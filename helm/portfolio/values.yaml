# =============================================================================
# VALUES PAR DÉFAUT — Portfolio Helm Chart
# =============================================================================
# Ces valeurs sont communes à tous les environnements.
# Surchargées par values-dev.yaml ou values-prod.yaml selon l'overlay ArgoCD.
# =============================================================================

# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
global:
  # Registre ECR — surchargé avec l'ID de compte réel
  imageRegistry: "ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  # Nom de l'application (utilisé dans les labels communs)
  appName: portfolio

# ---------------------------------------------------------------------------
# Backend — Spring Boot Java 21
# ---------------------------------------------------------------------------
backend:
  enabled: true

  image:
    repository: portfolio-backend
    # Tag mis à jour automatiquement par le workflow GitOps (ci-gitops.yml)
    tag: latest
    pullPolicy: Always

  replicas: 2

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Variables d'environnement non-sensibles (ConfigMap)
  config:
    SPRING_PROFILES_ACTIVE: "prod"
    SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
    SERVER_PORT: "8080"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
    JWT_EXPIRATION_MS: "86400000"
    JAVA_TOOL_OPTIONS: >-
      -XX:+UseG1GC
      -XX:MaxGCPauseMillis=200
      -Djava.security.egd=file:/dev/./urandom

  # Référence au Secret Kubernetes (créé hors Helm)
  secretName: portfolio-secrets

  probes:
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3

  # Anti-affinité : répartir sur des nœuds différents
  podAntiAffinity: true

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# ---------------------------------------------------------------------------
# Frontend — Angular 21 + NGINX
# ---------------------------------------------------------------------------
frontend:
  enabled: true

  image:
    repository: portfolio-frontend
    tag: latest
    pullPolicy: Always

  replicas: 2

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"

  probes:
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20

  podAntiAffinity: true

  securityContext:
    runAsNonRoot: true
    runAsUser: 101     # nginx
    fsGroup: 101

# ---------------------------------------------------------------------------
# Ingress — NGINX Ingress Controller
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: portfolio.local
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    enabled: false
    secretName: portfolio-tls-cert
    issuer: ""     # cert-manager cluster-issuer (ex: letsencrypt-prod)

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler (optionnel, activé en prod)
# ---------------------------------------------------------------------------
hpa:
  enabled: false
  backend:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Pod Disruption Budget (optionnel, activé en prod)
# ---------------------------------------------------------------------------
pdb:
  enabled: false
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1
