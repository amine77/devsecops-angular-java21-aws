# =============================================================================
# ClusterSecretStore — Connexion à AWS Secrets Manager
# =============================================================================
#
# Un ClusterSecretStore est partagé entre TOUS les namespaces du cluster.
# ESO utilise l'IAM Instance Profile de l'EC2 (via le credential provider AWS SDK).
# Aucune clé secrète stockée dans K8s — authentification via rôle IAM.
#
# Prérequis :
#   - IAM Instance Profile avec permission secretsmanager:GetSecretValue
#     sur les ARN portfolio/* (configuré dans terraform/modules/ec2/main.tf)
#   - ESO installé dans le namespace external-secrets
#
# Sync-Wave 1 : créé après ESO (wave 0), avant les ExternalSecrets (wave 2)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    # ArgoCD SyncWave — ESO operator (wave 0) doit être prêt en premier
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3   # Même région que les secrets Terraform

      # Authentification via EC2 Instance Profile (IAM role)
      # ESO utilise la chaîne de credentials AWS SDK par défaut :
      #   1. Variables d'env (non présentes)
      #   2. ~/.aws/credentials (non présent)
      #   3. Instance Metadata Service (IMDS) → IAM Role attaché à EC2 ✅
      auth:
        # Pas de secretRef → utilise automatiquement l'IAM Instance Profile
        # C'est le pattern recommandé pour K3s sur EC2
