# =============================================================================
# ExternalSecret — portfolio-dev
# =============================================================================
#
# Synchronise le secret AWS Secrets Manager "portfolio/dev" (JSON)
# vers un Kubernetes Secret "portfolio-secrets" dans le namespace portfolio-dev.
#
# La synchronisation se fait toutes les heures (refreshInterval: 1h).
# En cas de rotation du secret dans AWS, K8s est mis à jour automatiquement.
# Le pod Spring Boot n'a PAS besoin de redémarrer : les volumes secrets
# sont mis à jour à chaud par Kubernetes.
#
# Sync-Wave 2 : après ClusterSecretStore (wave 1)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: portfolio-secrets
  namespace: portfolio-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Intervalle de synchronisation (rafraîchit le secret K8s depuis AWS)
  # 1h = équilibre entre fraîcheur et appels API Secrets Manager ($0.05/10k calls)
  refreshInterval: 1h

  # Référence au ClusterSecretStore défini ci-dessus
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: portfolio-secrets        # Nom du Kubernetes Secret créé
    creationPolicy: Owner          # ESO est propriétaire — le supprime si ExternalSecret supprimé
    # Template optionnel pour ajouter des labels/annotations au Secret créé
    template:
      metadata:
        labels:
          app: portfolio
          managed-by: external-secrets-operator

  # Mapping : clé K8s ← propriété JSON du secret AWS
  # Le secret AWS "portfolio/dev" contient un JSON :
  # {
  #   "db-url": "jdbc:postgresql://...",
  #   "db-username": "...",
  #   "db-password": "...",
  #   "jwt-secret": "...",
  #   "redis-host": "..."
  # }
  data:
    - secretKey: db-url          # Nom dans le K8s Secret
      remoteRef:
        key: portfolio/dev       # Nom du secret dans AWS Secrets Manager
        property: db-url         # Propriété JSON à extraire

    - secretKey: db-username
      remoteRef:
        key: portfolio/dev
        property: db-username

    - secretKey: db-password
      remoteRef:
        key: portfolio/dev
        property: db-password

    - secretKey: jwt-secret
      remoteRef:
        key: portfolio/dev
        property: jwt-secret

    - secretKey: redis-host
      remoteRef:
        key: portfolio/dev
        property: redis-host
