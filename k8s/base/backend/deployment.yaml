apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  labels:
    app: portfolio-backend
    component: backend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # Zero-downtime : toujours au moins 2 pods dispo
  template:
    metadata:
      labels:
        app: portfolio-backend
        component: backend
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # -----------------------------------------------------------------------
      # Sécurité pod-level
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # -----------------------------------------------------------------------
      # Anti-affinité : répartir les pods sur des nœuds différents
      # -----------------------------------------------------------------------
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: portfolio-backend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          image: portfolio-backend:latest   # Remplacé par Kustomize overlay
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # -----------------------------------------------------------------
          # Variables d'environnement (non sensibles via ConfigMap,
          # sensibles via Secret)
          # -----------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: portfolio-backend-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: jwt-secret
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: redis-host

          # -----------------------------------------------------------------
          # Health checks
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3

          # -----------------------------------------------------------------
          # Ressources
          # -----------------------------------------------------------------
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # -----------------------------------------------------------------
          # Sécurité container-level
          # -----------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Spring Boot a besoin d'écrire dans /tmp
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
