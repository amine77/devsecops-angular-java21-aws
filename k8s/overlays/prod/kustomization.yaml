apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# OVERLAY PROD — portfolio-prod
# =============================================================================
# Namespace dédié, 3 replicas, TLS activé, resource limits plus élevées.
# =============================================================================

namespace: portfolio-prod

bases:
  - ../../base

# ---------------------------------------------------------------------------
# Images — mises à jour par le workflow GitOps après validation en dev
# ---------------------------------------------------------------------------
images:
  - name: portfolio-backend
    newName: ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/portfolio-backend
    newTag: latest                # ← Promu depuis dev après tests

  - name: portfolio-frontend
    newName: ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/portfolio-frontend
    newTag: latest                # ← Promu depuis dev après tests

# ---------------------------------------------------------------------------
# Patches
# ---------------------------------------------------------------------------
patches:
  # 3 replicas en prod (HA)
  - path: patches/replicas.yaml
    target:
      kind: Deployment
      labelSelector: "component=backend"
  - path: patches/frontend-replicas.yaml
    target:
      kind: Deployment
      labelSelector: "component=frontend"

  # Resource limits plus élevées en prod
  - path: patches/backend-resources.yaml

  # Host prod + TLS
  - path: patches/ingress-host.yaml

# ---------------------------------------------------------------------------
# Labels
# ---------------------------------------------------------------------------
commonLabels:
  environment: prod
  managed-by: argocd
