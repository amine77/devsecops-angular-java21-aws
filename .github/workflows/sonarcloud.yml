# =============================================================================
# SONARCLOUD — Analyse qualité + Quality Gate
# =============================================================================
# Projet SonarCloud : amine77_devsecops-angular-java21-aws
# Dashboard        : https://sonarcloud.io/summary/overall?id=amine77_devsecops-angular-java21-aws
#
# Prérequis secret GitHub :
#   SONAR_TOKEN — sonarcloud.io → My Account → Security → Generate Token
#
# Ce que remonte ce workflow :
#   - Coverage backend  : JaCoCo XML (tests unitaires, hors *IT.java Testcontainers)
#   - Coverage frontend : lcov.info (jest --coverage)
#   - Bugs / Vulnerabilities / Code Smells / Security Hotspots
#   - Quality Gate (bloque la PR si non passé)
# =============================================================================

name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:

  sonarcloud:
    name: SonarCloud — Java 21 + Angular 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historique complet — requis pour le blame Git SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-

      - name: Backend — tests unitaires + couverture JaCoCo
        working-directory: backend
        run: |
          mvn verify -B \
            -Dcheckstyle.skip=true \
            -Dexcludes="**/*IT.java,**/*IntegrationTest.java" \
            -Dmaven.test.failure.ignore=true
        # -Dexcludes : saute Testcontainers (*IT.java) et tests d'intégration H2 (*IntegrationTest.java)
        # -Dmaven.test.failure.ignore=true : génère le rapport JaCoCo même si des tests échouent
        # continue-on-error : le JaCoCo check (seuil 70%) fait échouer Maven exit code 1,
        #   mais le jacoco.xml EST généré avant ce check — on laisse tourner les étapes suivantes
        continue-on-error: true

      - name: Backend — copier les dépendances Maven (sonar.java.libraries)
        working-directory: backend
        run: mvn dependency:copy-dependencies -DoutputDirectory=target/dependency -q -B
        # Nécessaire pour sonar-scanner CLI : sans les JARs, l'analyse Java est moins précise
        # (warning "sonar.java.libraries is empty" dans SonarCloud)

      - name: Frontend — install deps + couverture Jest (lcov)
        working-directory: frontend
        run: |
          npm ci
          npm run test:ci
        continue-on-error: true

      - name: Diagnostic — vérifier que les fichiers de couverture existent
        run: |
          echo "=== JaCoCo XML (backend) ==="
          find backend/target -name "jacoco.xml" 2>/dev/null && echo "✔ jacoco.xml trouvé" || echo "✘ jacoco.xml ABSENT"

          echo "=== lcov.info (frontend) ==="
          find frontend/coverage -name "lcov.info" 2>/dev/null && echo "✔ lcov.info trouvé" || echo "✘ lcov.info ABSENT"

          echo "=== Tailles ==="
          ls -lh backend/target/site/jacoco/jacoco.xml 2>/dev/null || true
          ls -lh frontend/coverage/lcov.info 2>/dev/null || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # La config est lue depuis sonar-project.properties à la racine du repo
