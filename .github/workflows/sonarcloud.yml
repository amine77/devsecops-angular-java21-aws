# =============================================================================
# SONARCLOUD — Analyse qualité + Quality Gate
# =============================================================================
# Un seul projet couvre tout le monorepo : Java 21 + TypeScript/Angular 20
#
# Projet SonarCloud : amine77_devsecops-angular-java21-aws
# Dashboard        : https://sonarcloud.io/summary/overall?id=amine77_devsecops-angular-java21-aws
#
# Prérequis secret GitHub :
#   SONAR_TOKEN — généré sur sonarcloud.io → My Account → Security → Generate Token
#
# Ce que remonte ce workflow :
#   - Coverage backend  : JaCoCo XML (mvn verify)
#   - Coverage frontend : lcov.info  (jest --coverage)
#   - Bugs / Vulnerabilities / Code Smells
#   - Security Hotspots
#   - Quality Gate (bloque la PR si non passé)
# =============================================================================

name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:

  sonarcloud:
    name: SonarCloud — Java 21 + Angular 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historique complet — requis pour le blame Git SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-

      - name: Backend — build + tests + couverture JaCoCo
        working-directory: backend
        run: mvn verify -B -Dcheckstyle.skip=true
        # continue-on-error : le scan Sonar se lance même si des tests échouent
        # (on veut voir la couverture partielle, pas bloquer l'analyse)
        continue-on-error: true

      - name: Frontend — install deps + couverture Jest (lcov)
        working-directory: frontend
        run: |
          npm ci
          npm run test:ci
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # La config est lue depuis sonar-project.properties à la racine du repo
