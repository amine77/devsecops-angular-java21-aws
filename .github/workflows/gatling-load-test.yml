# =============================================================================
# GATLING LOAD TESTS — Tests de charge (ex-k6, Phase 14)
# =============================================================================
# Déclenchement manuel uniquement (les tests de charge ne tournent PAS
# à chaque push — trop longs et gourmands en ressources).
#
# Démarre une stack complète (Postgres + Redis + Backend) dans le runner CI,
# puis exécute la simulation Gatling choisie via le plugin Maven et publie
# le rapport HTML généré dans backend/target/gatling/.
#
# UTILISATION :
#   GitHub → Actions → "Load Tests — Gatling" → Run workflow
#   Sélectionner le scénario et l'URL cible.
# =============================================================================

name: Load Tests — Gatling

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Simulation Gatling à exécuter'
        required: true
        default: 'public-projects'
        type: choice
        options:
          - public-projects
          - auth-stress
          - admin-flow
          - all
      base_url:
        description: 'URL du backend (vide = démarrage auto dans CI)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  load-test:
    name: Gatling — ${{ inputs.scenario }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: portfolio_dev
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Démarre le backend Spring Boot en arrière-plan si pas d'URL fournie
      - name: Démarrer le backend Spring Boot
        if: inputs.base_url == ''
        working-directory: backend
        run: |
          mvn spring-boot:run \
            -Dspring-boot.run.profiles=dev \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_dev \
            -Dspring.datasource.username=portfolio_user \
            -Dspring.datasource.password=portfolio_pass \
            -Dspring.data.redis.host=localhost \
            -Dspring.kafka.listener.auto-startup=false \
            -Dspring.kafka.admin.auto-create=false \
            -DJWT_SECRET=gatling-test-secret-key-minimum-256-bits-for-hs256-algorithm &
          echo "Backend PID: $!"
        env:
          JWT_SECRET: gatling-test-secret-key-minimum-256-bits-for-hs256-algorithm
          # Rate limiting désactivé pour ce run — et uniquement pour ce run.
          # AuthStressSimulation mesure la capacité de POST /auth/login à
          # absorber des hashs BCrypt. Or toutes les requêtes Gatling sortent
          # d'une même IP : avec le limiteur actif, la simulation mesurerait
          # la vitesse à laquelle on renvoie des 429, pas celle du backend.
          # La protection reste active en production ; c'est bien pour éviter
          # exactement ce profil de charge qu'elle existe.
          RATE_LIMIT_ENABLED: 'false'

      - name: Attendre que le backend soit prêt
        if: inputs.base_url == ''
        run: |
          echo "Attente du backend sur :8080..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Backend prêt après ${i}x10s"
              break
            fi
            echo "Tentative $i/30..."
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health | python3 -m json.tool

      - name: Déterminer l'URL cible
        id: target
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:8080" >> $GITHUB_OUTPUT
          fi

      # ── Simulation unique ────────────────────────────────────────────────────
      - name: Run Gatling — ${{ inputs.scenario }}
        if: inputs.scenario != 'all'
        working-directory: backend
        run: |
          declare -A SIMULATIONS=(
            [public-projects]=com.portfolio.backend.loadtest.PublicProjectsSimulation
            [auth-stress]=com.portfolio.backend.loadtest.AuthStressSimulation
            [admin-flow]=com.portfolio.backend.loadtest.AdminFlowSimulation
          )
          mvn --batch-mode gatling:test \
            -DbaseUrl=${{ steps.target.outputs.url }} \
            -Dgatling.simulationClass="${SIMULATIONS[${{ inputs.scenario }}]}"
        continue-on-error: true

      # ── Toutes les simulations ───────────────────────────────────────────────
      - name: Run Gatling — toutes les simulations
        if: inputs.scenario == 'all'
        working-directory: backend
        run: |
          for sim in PublicProjectsSimulation AuthStressSimulation AdminFlowSimulation; do
            echo "════════ $sim ════════"
            mvn --batch-mode gatling:test \
              -DbaseUrl=${{ steps.target.outputs.url }} \
              -Dgatling.simulationClass="com.portfolio.backend.loadtest.$sim" || true
            sleep 5
          done
        continue-on-error: true

      - name: Upload rapports Gatling
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gatling-reports-${{ github.run_id }}
          path: backend/target/gatling/**
          retention-days: 30
