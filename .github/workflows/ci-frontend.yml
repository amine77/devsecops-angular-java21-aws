# =============================================================================
# CI FRONTEND — Angular 18
# =============================================================================
# Pipeline de CI pour le frontend Angular.
#
# Étapes :
#   1. Lint (ESLint + Prettier)  — Qualité du code TypeScript
#   2. Tests Jest + Coverage     — Tests unitaires Angular
#   3. Build production          — Vérifie que le build compile
#   4. SAST — Semgrep            — Analyse statique sécurité TypeScript/Angular
#   5. npm audit                 — Dépendances avec vulnérabilités connues
#   6. Trivy scan image          — Vulnérabilités de l'image NGINX finale
# =============================================================================

name: CI — Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1 : LINT
  # ===========================================================================
  lint:
    name: 🔎 ESLint + Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache npm : réutilise node_modules entre les runs
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ===========================================================================
  # JOB 2 : TESTS
  # ===========================================================================
  test:
    name: 🧪 Tests Jest + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests avec couverture
        run: npm run test:ci
        # test:ci = jest --coverage --ci --reporters=default --reporters=jest-junit
        # --ci : mode CI (fail sur les snapshots obsolètes, pas de watch)
        # jest-junit : rapport XML pour GitHub Actions

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: frontend/coverage/
          retention-days: 7

  # ===========================================================================
  # JOB 3 : BUILD PRODUCTION
  # ===========================================================================
  build:
    name: 🏗️ Build Angular Production
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        # ng build --configuration production
        # Échoue si : erreur TypeScript, budget dépassé, etc.

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: frontend/dist/
          retention-days: 3

  # ===========================================================================
  # JOB 4 : SAST — SEMGREP (Analyse statique TypeScript/Angular)
  # ===========================================================================
  sast-semgrep:
    name: 🔍 SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep — SAST TypeScript/Angular
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/javascript
            p/secrets
            p/owasp-top-ten
          # Résultats dans GitHub Security → Code scanning
          generateSarif: '1'
        env:
          # Token Semgrep optionnel (résultats Dashboard)
          # SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_TIMEOUT: '300'
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-typescript
        continue-on-error: true

  # ===========================================================================
  # JOB 5 : SÉCURITÉ DES DÉPENDANCES
  # ===========================================================================
  dependency-audit:
    name: 🛡️ npm audit + Trivy fs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # --audit-level=high : échoue sur HIGH et CRITICAL uniquement
        # || true : ne pas bloquer le pipeline (informationnel)
        run: npm audit --audit-level=high || true

      - name: Trivy — Scan dossier frontend (secrets + misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-fs.sarif'
          scanners: 'secret,misconfig,vuln'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend-fs.sarif
          category: trivy-frontend-fs
        continue-on-error: true

  # ===========================================================================
  # JOB 6 : BUILD IMAGE DOCKER + TRIVY SCAN
  # ===========================================================================
  docker-build-scan:
    name: 🐳 Docker Build + Trivy Image
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: portfolio-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — Scan image frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image
