# =============================================================================
# K6 LOAD TESTS — Tests de charge
# =============================================================================
# Déclenchement manuel uniquement (les tests de charge ne tournent PAS
# à chaque push — trop longs et gourmands en ressources).
#
# Démarre une stack complète (Postgres + Backend) dans le runner CI,
# puis exécute le scénario k6 choisi et publie le rapport HTML.
#
# UTILISATION :
#   GitHub → Actions → "Load Tests — k6" → Run workflow
#   Sélectionner le scénario et la cible URL.
# =============================================================================

name: Load Tests — k6

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scénario k6 à exécuter'
        required: true
        default: '01-public-projects'
        type: choice
        options:
          - 01-public-projects
          - 02-auth-stress
          - 03-admin-flow
          - all
      base_url:
        description: 'URL du backend (vide = démarrage auto dans CI)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  load-test:
    name: k6 — ${{ inputs.scenario }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: portfolio_dev
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Démarre le backend Spring Boot en arrière-plan si pas d'URL fournie
      - name: Démarrer le backend Spring Boot
        if: inputs.base_url == ''
        working-directory: backend
        run: |
          mvn spring-boot:run \
            -Dspring-boot.run.profiles=dev \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_dev \
            -Dspring.datasource.username=portfolio_user \
            -Dspring.datasource.password=portfolio_pass \
            -Dspring.data.redis.host=localhost \
            -Dspring.kafka.listener.auto-startup=false \
            -Dspring.kafka.admin.auto-create=false \
            -DJWT_SECRET=k6-test-secret-key-minimum-256-bits-for-hs256-algorithm &
          echo "Backend PID: $!"
        env:
          JWT_SECRET: k6-test-secret-key-minimum-256-bits-for-hs256-algorithm

      - name: Attendre que le backend soit prêt
        if: inputs.base_url == ''
        run: |
          echo "Attente du backend sur :8080..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Backend prêt après ${i}x10s"
              break
            fi
            echo "Tentative $i/30..."
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health | python3 -m json.tool

      - name: Installer k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Créer le dossier de rapports
        run: mkdir -p k6/reports

      - name: Déterminer l'URL cible
        id: target
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:8080" >> $GITHUB_OUTPUT
          fi

      # ── Scénario unique ──────────────────────────────────────────────────────
      - name: Run k6 — ${{ inputs.scenario }}
        if: inputs.scenario != 'all'
        run: |
          k6 run \
            -e BASE_URL=${{ steps.target.outputs.url }} \
            k6/scenarios/${{ inputs.scenario }}.js
        continue-on-error: true

      # ── Tous les scénarios ───────────────────────────────────────────────────
      - name: Run k6 — tous les scénarios
        if: inputs.scenario == 'all'
        run: |
          for scenario in 01-public-projects 02-auth-stress 03-admin-flow; do
            echo "════════ $scenario ════════"
            k6 run \
              -e BASE_URL=${{ steps.target.outputs.url }} \
              k6/scenarios/${scenario}.js || true
            sleep 5
          done
        continue-on-error: true

      - name: Upload rapports HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports-${{ github.run_id }}
          path: k6/reports/*.html
          retention-days: 30
