# =============================================================================
# SECURITY — Scans de sécurité globaux (hebdomadaires + push main)
# =============================================================================
# Ce pipeline est le gardien sécurité de tout le projet.
#
# Différence avec les pipelines CI backend/frontend :
#   - CI pipelines : déclenchés par chaque push, vérification rapide
#   - Security pipeline : scan complet, hebdomadaire + sur main
#
# Étapes :
#   1. GitLeaks        — Détection de secrets dans l'historique Git
#   2. CodeQL Full     — Analyse profonde Java + TypeScript
#   3. Trivy Full      — Scan toute la codebase (secrets, IaC, dépendances)
#   4. Semgrep Full    — SAST Java + TypeScript + Secrets
#   5. OWASP Full      — Backend Maven + npm audit
#
# Les résultats sont visibles dans :
#   GitHub → Security → Code scanning alerts
#   GitHub → Security → Secret scanning alerts
# =============================================================================

name: Security Scans

on:
  # Scan hebdomadaire (dimanche à 2h UTC — coût nul pendant le sommeil)
  schedule:
    - cron: '0 2 * * 0'
  # Aussi sur chaque push vers main
  push:
    branches: [main]
  workflow_dispatch:

# Node.js 24 opt-in (obligatoire à partir du 2 juin 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  security-events: write
  actions: read
  contents: read

jobs:

  # ===========================================================================
  # JOB 1 : GITLEAKS — Détection de secrets dans le code/historique Git
  # ===========================================================================
  secret-scanning:
    name: 🔑 GitLeaks — Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historique complet pour GitLeaks)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Historique complet — GitLeaks scanne tous les commits

      - name: GitLeaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optionnel pour les orgs
        continue-on-error: true
        # continue-on-error : ne pas bloquer sur des false positives
        # Les résultats apparaissent dans GitHub → Security → Secret scanning

  # ===========================================================================
  # JOB 2 : CODEQL — Java + TypeScript (analyse complète)
  # ===========================================================================
  codeql-full:
    name: 🔍 CodeQL — Java + TypeScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]
        # javascript-typescript couvre les fichiers .ts et .js

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21 (pour le build Java)
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build Java (pour CodeQL)
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn compile -B -DskipTests -Dcheckstyle.skip=true

      - name: Autobuild TypeScript
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ===========================================================================
  # JOB 3 : TRIVY — Scan complet (filesystem, IaC, secrets)
  # ===========================================================================
  trivy-full:
    name: 🛡️ Trivy — Full Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy — Scan filesystem complet
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        # Java vulns couvertes par OWASP Dependency Check dans CI Backend
        # continue-on-error : evite l'echec sur 429 Maven Central (rate limit transitoire)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-full.sarif'
          scanners: 'secret,misconfig'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'backend/target,frontend/node_modules,frontend/dist'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-full.sarif
          category: trivy-full-scan

      - name: Trivy — Scan Docker Compose (misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './docker'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy — Scan Dockerfile backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './backend/Dockerfile'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ===========================================================================
  # JOB 4 : SEMGREP FULL — SAST Java + TypeScript + Secrets
  # ===========================================================================
  semgrep-full:
    name: 🔍 Semgrep — Full SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep Full Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/spring-framework
            p/typescript
            p/javascript
            p/secrets
            p/owasp-top-ten
            p/cwe-top-25
            p/docker
        env:
          SEMGREP_TIMEOUT: '600'
        continue-on-error: true

  # ===========================================================================
  # JOB 5 : OWASP DEPENDENCY CHECK (backend + frontend)
  # ===========================================================================
  owasp-full:
    name: 🔒 OWASP — Backend + Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache OWASP NVD
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-

      - name: OWASP Dependency Check — Backend Maven
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML,JSON \
            -B || true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: npm audit — Frontend
        working-directory: frontend
        run: |
          npm audit --json > ../npm-audit.json || true
          echo "=== npm audit summary ==="
          npm audit --audit-level=high || true

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            backend/target/dependency-check-report.html
            npm-audit.json
          retention-days: 30

  # ===========================================================================
  # RÉSUMÉ — Notification des résultats
  # ===========================================================================
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, codeql-full, trivy-full, semgrep-full, owasp-full]
    if: always()

    steps:
      - name: Security scan summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitLeaks (Secret Detection) | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (Java + TypeScript) | ${{ needs.codeql-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Full Scan) | ${{ needs.trivy-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep (SAST) | ${{ needs.semgrep-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP DC (Dependencies) | ${{ needs.owasp-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Résultats détaillés → [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
