# =============================================================================
# CI BACKEND — Spring Boot Java 21
# =============================================================================
# Pipeline de CI pour le backend Spring Boot.
#
# Étapes :
#   1. Checkstyle   — Style Java (Google Java Style adapté)
#   2. Tests        — mvn verify + JaCoCo coverage ≥ 70%
#   3. SAST         — CodeQL (analyse statique sécurité Java)
#   4. OWASP DC     — Dépendances avec CVE connues
#   5. Trivy        — Scan vulnérabilités de l'image Docker finale
#
# Déclencheurs :
#   - Push sur main/develop
#   - Pull Requests vers main
#   - Workflow_dispatch : lancement manuel
# =============================================================================

name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

# Node.js 24 opt-in (obligatoire à partir du 2 juin 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Annule les runs précédents sur la même branche (économie de minutes GitHub Actions)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1 : QUALITÉ DU CODE
  # ===========================================================================
  quality:
    name: 📋 Checkstyle + Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache Maven : réutilise ~/.m2/repository entre les runs
          # Économise ~2 minutes par run en CI
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -B
        # Échoue si le code ne respecte pas checkstyle.xml
        # Raison : un code non formaté indique un manque de rigueur

      - name: Compile (validation rapide)
        run: mvn compile -B -DskipTests

  # ===========================================================================
  # JOB 2 : TESTS + COVERAGE (JaCoCo)
  # ===========================================================================
  test:
    name: 🧪 Tests + Coverage (JaCoCo ≥ 70%)
    runs-on: ubuntu-latest
    # Pas de "needs: quality" : Checkstyle et les tests sont indépendants,
    # les exécuter en parallèle fait gagner ~2-3 min par run.
    # docker-build-scan attend toujours les deux (needs: [quality, test]).
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn verify -B
        env:
          JWT_SECRET: test-secret-key-minimum-256-bits-for-hmac-sha256-algorithm-ci

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  # ===========================================================================
  # JOB 3 : SAST — ANALYSE STATIQUE DE SÉCURITÉ
  # ===========================================================================
  sast-codeql:
    name: 🔍 SAST — CodeQL
    runs-on: ubuntu-latest
    # CodeQL peut tourner en parallèle du job test
    permissions:
      # Requis pour uploader les résultats SARIF dans GitHub Security
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          # Requêtes de sécurité étendues pour Java
          # security-extended : inclut les CWE les plus importants
          queries: security-extended,security-and-quality

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build pour CodeQL
        working-directory: backend
        run: mvn compile -B -DskipTests -Dcheckstyle.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          # Les résultats apparaissent dans :
          # GitHub → Security → Code scanning alerts
          upload: true

  # ===========================================================================
  # JOB 4 : OWASP DEPENDENCY CHECK
  # ===========================================================================
  owasp-dependency-check:
    name: 🛡️ OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Cache de la base de données NVD (National Vulnerability Database)
      # Sans cache : téléchargement ~500MB à chaque run
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            owasp-nvd-

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=../owasp-suppressions.xml \
            -Dformats=HTML,SARIF \
            -B
          # BLOQUANT sur CVSS >= 9 (CRITICAL) : les false positives se gèrent
          # via owasp-suppressions.xml, pas en ignorant l'exit code.
          # CVSS 7-9 (HIGH) : remonté dans le rapport SARIF sans bloquer.

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.*
          retention-days: 7

      - name: Upload OWASP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

  # ===========================================================================
  # JOB 5 : BUILD IMAGE DOCKER + TRIVY SCAN
  # ===========================================================================
  docker-build-scan:
    name: 🐳 Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Retry sur la création du builder Buildx : le pull de moby/buildkit
      # depuis Docker Hub échoue parfois sur les runners mutualisés (timeout).
      # 3 tentatives avec 30s de délai couvrent les pics de charge transitoires.
      - name: Set up Docker Buildx (avec retry)
        run: |
          for i in 1 2 3; do
            if docker buildx create --name mybuilder --use --bootstrap; then
              echo "Buildx prêt (tentative $i)"
              break
            fi
            echo "Tentative $i/3 échouée, retry dans 30s..."
            docker buildx rm mybuilder 2>/dev/null || true
            [ $i -lt 3 ] && sleep 30
          done
          docker buildx inspect

      - name: Build image Docker backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: portfolio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Passe 1 — RAPPORT : scan complet (MEDIUM+) exporté en SARIF,
      # visible dans GitHub → Security, sans bloquer.
      - name: Trivy — Scan vulnérabilités image (rapport)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # Passe 2 — GATE bloquant : échoue sur CRITICAL corrigeable.
      # ignore-unfixed : ne bloque pas sur les CVE Alpine sans patch disponible
      # (on ne peut rien y faire à part attendre l'upstream).
      - name: Trivy — Gate bloquant (CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # misconfig retiré des scanners : Trivy résout les POM Maven Central
      # pour valider les dépendances → déclenche des 429 Too Many Requests
      # sur les runners mutualisés (IP partagée, quota épuisé rapidement).
      # La détection de misconfig Java est couverte par OWASP Dependency Check.
      # offline-scan : même avec scanners=secret, Trivy tente encore de
      # résoudre les POM Maven Central pour classifier les jars sans
      # pom.properties embarqué — sans rapport avec la détection de secrets.
      # --offline-scan supprime ces appels réseau (cause du 429/blocage IP
      # 30 min observé sur le run 29782454495).
      - name: Trivy — Scan filesystem (secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          scanners: 'secret'
        env:
          TRIVY_OFFLINE_SCAN: true
