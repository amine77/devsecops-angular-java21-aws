# =============================================================================
# CI BACKEND — Spring Boot Java 21
# =============================================================================
# Pipeline de CI pour le backend Spring Boot.
#
# Étapes :
#   1. Checkstyle   — Style Java (Google Java Style adapté)
#   2. Build        — mvn verify sans tests (-DskipTests)
#   3. SAST         — CodeQL (analyse statique sécurité Java)
#   4. OWASP DC     — Dépendances avec CVE connues
#   5. Trivy        — Scan vulnérabilités de l'image Docker finale
#
# Déclencheurs :
#   - Push sur main/develop
#   - Pull Requests vers main
#   - Workflow_dispatch : lancement manuel
# =============================================================================

name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

# Node.js 24 opt-in (obligatoire à partir du 2 juin 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Annule les runs précédents sur la même branche (économie de minutes GitHub Actions)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1 : QUALITÉ DU CODE
  # ===========================================================================
  quality:
    name: 📋 Checkstyle + Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache Maven : réutilise ~/.m2/repository entre les runs
          # Économise ~2 minutes par run en CI
          cache: 'maven'

      - name: Checkstyle
        run: mvn checkstyle:check -B
        # Échoue si le code ne respecte pas checkstyle.xml
        # Raison : un code non formaté indique un manque de rigueur

      - name: Compile (validation rapide)
        run: mvn compile -B -DskipTests

  # ===========================================================================
  # JOB 2 : BUILD (TESTS DÉSACTIVÉS)
  # ===========================================================================
  test:
    name: 🧪 Build (tests désactivés)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn verify -B -DskipTests
        env:
          JWT_SECRET: test-secret-key-minimum-256-bits-for-hmac-sha256-algorithm

  # ===========================================================================
  # JOB 3 : SAST — ANALYSE STATIQUE DE SÉCURITÉ
  # ===========================================================================
  sast-codeql:
    name: 🔍 SAST — CodeQL
    runs-on: ubuntu-latest
    # CodeQL peut tourner en parallèle du job test
    permissions:
      # Requis pour uploader les résultats SARIF dans GitHub Security
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          # Requêtes de sécurité étendues pour Java
          # security-extended : inclut les CWE les plus importants
          queries: security-extended,security-and-quality

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build pour CodeQL
        working-directory: backend
        run: mvn compile -B -DskipTests -Dcheckstyle.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          # Les résultats apparaissent dans :
          # GitHub → Security → Code scanning alerts
          upload: true

  # ===========================================================================
  # JOB 4 : OWASP DEPENDENCY CHECK
  # ===========================================================================
  owasp-dependency-check:
    name: 🛡️ OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Cache de la base de données NVD (National Vulnerability Database)
      # Sans cache : téléchargement ~500MB à chaque run
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            owasp-nvd-

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=../owasp-suppressions.xml \
            -Dformats=HTML,SARIF \
            -B 2>&1 || true
          # || true : ne pas faire échouer le pipeline sur les false positives
          # En production, retirer le || true et gérer via owasp-suppressions.xml

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.*
          retention-days: 7

      - name: Upload OWASP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

  # ===========================================================================
  # JOB 5 : BUILD IMAGE DOCKER + TRIVY SCAN
  # ===========================================================================
  docker-build-scan:
    name: 🐳 Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: portfolio-backend:${{ github.sha }}
          # Cache Docker layers entre les runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — Scan vulnérabilités image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          # Ne fail pas le build sur les vulnérabilités — remonte dans Security
          # En production : exit-code: '1' + severity: 'HIGH,CRITICAL'
          exit-code: '0'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Trivy — Scan filesystem (secrets + config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          scanners: 'secret,misconfig'
