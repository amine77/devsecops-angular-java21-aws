# =============================================================================
# APPLICATION.PROPERTIES — Contexte de test
# =============================================================================
# Surcharge la config principale pour les tests unitaires et d'intégration.
# Raison : les tests tournent sans infrastructure externe (Kafka, vraie DB, etc.)
# =============================================================================

# =============================================================================
# REDIS / CACHE — Désactivé en contexte de test
# =============================================================================
# spring.cache.type=none → les annotations @Cacheable/@CacheEvict deviennent no-ops.
# Raison : pas de Redis disponible en test unitaire/WebMvcTest.
spring.cache.type=none

# =============================================================================
# RATE LIMITING — Désactivé par défaut en contexte de test
# =============================================================================
# Les tranches @WebMvcTest partagent un LoginRateLimiter singleton entre toutes
# les méthodes d'une même classe : laisser le limiteur actif rendrait les
# tests dépendants de leur ordre d'exécution et de leur nombre.
# LoginRateLimitFilterTest le réactive explicitement via @TestPropertySource,
# avec des seuils resserrés et une IP distincte par test.
app.rate-limit.login.enabled=false

# =============================================================================
# KAFKA — Désactivé en contexte de test
# =============================================================================
# Les listeners Kafka ne démarrent pas → pas de connexion au broker.
# Les services qui dépendent de EventPublisher utilisent @MockBean dans les tests.
spring.kafka.listener.auto-startup=false
# Désactive KafkaAdmin (création automatique de topics au démarrage)
spring.kafka.admin.auto-create=false
# Logs Kafka silencieux dans les tests
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
