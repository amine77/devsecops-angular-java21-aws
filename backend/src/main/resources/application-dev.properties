# =============================================================================
# APPLICATION-DEV.PROPERTIES — Configuration développement local
# =============================================================================
# Activer ce profil : -Dspring.profiles.active=dev
# Ou : export SPRING_PROFILES_ACTIVE=dev
#
# Objectif : démarrage < 30 secondes en local (Docker ou natif)
# =============================================================================

# --- Base de données locale (docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_dev
spring.datasource.username=${DB_USERNAME:portfolio_user}
spring.datasource.password=${DB_PASSWORD:portfolio_pass}

# =============================================================================
# OPTIMISATION #1 — LAZY INITIALIZATION
# =============================================================================
# Les beans Spring sont créés à la PREMIÈRE UTILISATION, pas au démarrage.
# Impact : startup 5 min → ~25 secondes.
# ⚠️  En prod (application-prod.properties) : désactivé (eager = fail-fast)
spring.main.lazy-initialization=true

# =============================================================================
# OPTIMISATION #2 — DÉSACTIVER LA VALIDATION HIBERNATE
# =============================================================================
# Hibernate ne re-valide pas le schéma au démarrage — Flyway s'en charge déjà.
# Impact : économise 2-3 minutes d'introspection PostgreSQL.
# ⚠️  En prod : conserver "validate" pour détecter les migrations manquantes.
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# OPTIMISATION #3 — LOGS AU MINIMUM EN DOCKER DEV
# =============================================================================
# DEBUG + TRACE = très verbeux = lent. En docker dev, INFO suffit.
# Pour déboguer une requête spécifique, activer DEBUG ponctuellement via Actuator :
#   POST /actuator/loggers/com.portfolio  {"configuredLevel":"DEBUG"}
logging.level.com.portfolio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Afficher le SQL est utile mais ralentit — désactivé par défaut, activer au besoin
spring.jpa.show-sql=false

# =============================================================================
# ACTUATOR — Exposer tout en dev (utile pour Swagger + health + loggers)
# =============================================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =============================================================================
# DEV TOOLS — Hot reload (uniquement hors Docker)
# =============================================================================
# DevTools est automatiquement désactivé dans un JAR empaqueté (Docker).
# Il s'active uniquement en mode "exploded" (mvn spring-boot:run / IDE).
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- CORS : autoriser ng serve en dev
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# =============================================================================
# KAFKA — Surcharge dev
# =============================================================================
# localhost:9092 : broker accessible depuis l'hôte (docker-compose.kafka.yml expose 9092)
# Overridden by KAFKA_BOOTSTRAP_SERVERS env var in Docker (broker name = "kafka")
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Logs Kafka en WARN pour ne pas polluer les logs dev
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
