# =============================================================================
# APPLICATION-DEV.PROPERTIES — Configuration développement local
# =============================================================================
# Activer ce profil : -Dspring.profiles.active=dev
# Ou : export SPRING_PROFILES_ACTIVE=dev
#
# En dev, on privilégie :
#   - Logs verbeux pour déboguer
#   - PostgreSQL local via Docker Compose
#   - Swagger accessible sans auth
#   - CORS ouvert pour ng serve :4200
# =============================================================================

# --- Base de données locale (docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_dev
spring.datasource.username=${DB_USERNAME:portfolio_user}
spring.datasource.password=${DB_PASSWORD:portfolio_pass}

# --- Afficher le SQL généré par Hibernate (dev uniquement)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logs verbeux en dev
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# --- Actuator : tout exposer en dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# --- DevTools (hot reload) — rechargement automatique
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- CORS : autoriser ng serve en dev
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
