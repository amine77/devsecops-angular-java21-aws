# =============================================================================
# APPLICATION.PROPERTIES — Configuration commune à tous les profils
# =============================================================================
# Raison d'une config commune : éviter la duplication entre dev et prod.
# Seules les valeurs qui changent par profil sont dans application-{profil}.properties
#
# Profil actif par défaut : dev
# En production, on passe -Dspring.profiles.active=prod (via variable d'env)
# =============================================================================

# --- Profil actif (surchargé par variable d'environnement SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Nom de l'application (utile pour les logs et le monitoring)
spring.application.name=portfolio-backend

# --- Port du serveur
server.port=${SERVER_PORT:8080}

# =============================================================================
# BASE DE DONNÉES — Valeurs communes (host/name surchargées par profil)
# =============================================================================
# HikariCP est le pool de connexions par défaut de Spring Boot.
# Raison : le pool évite d'ouvrir/fermer une connexion à chaque requête HTTP.
# Sur Free Tier RDS (t3.micro), on limite le pool pour ne pas saturer.

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PortfolioHikariPool

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# ddl-auto=validate : Hibernate VÉRIFIE que le schéma DB correspond aux entités
# mais NE MODIFIE PAS la DB. Flyway gère les migrations.
# Raison : on ne laisse JAMAIS Hibernate modifier le schéma en production.
spring.jpa.hibernate.ddl-auto=validate

# Afficher le SQL en dev (désactivé en prod via profil)
spring.jpa.show-sql=false

# Formatage SQL lisible dans les logs
spring.jpa.properties.hibernate.format_sql=true

# NOTE : hibernate.dialect n'est plus nécessaire depuis Hibernate 6 (auto-détecté)
# Suppression volontaire pour éviter le warning HHH90000025

# Désactive l'Open Session in View (évite WARN JpaWebConfiguration)
# Raison : stateless REST API — pas besoin d'une session JPA pendant le rendu de vue
spring.jpa.open-in-view=false

# Batch size pour les insertions en masse (optimisation)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================================================
# FLYWAY — MIGRATIONS DE BASE DE DONNÉES
# =============================================================================
# Raison : Flyway s'exécute AVANT Hibernate au démarrage.
# Il applique les scripts SQL manquants dans db/migration/
# Chaque script est exécuté UNE SEULE FOIS (idempotent).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =============================================================================
# SPRING SECURITY
# =============================================================================
# Le mot de passe par défaut Spring Security est désactivé
# (on gère nous-mêmes l'auth via JWT)

# =============================================================================
# VIRTUAL THREADS (Java 21 — Project Loom)
# =============================================================================
# Raison : Virtual Threads permettent de gérer beaucoup plus de requêtes
# concurrentes avec peu de RAM. Idéal pour EC2 t2.micro.
# Au lieu de bloquer un thread OS (lourd), on utilise des virtual threads (légers).
spring.threads.virtual.enabled=true

# =============================================================================
# ACTUATOR — HEALTH CHECKS POUR KUBERNETES
# =============================================================================
# Raison : Kubernetes utilise /actuator/health pour déterminer si le pod
# est vivant (liveness) et prêt à recevoir du trafic (readiness).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Prometheus est auto-configuré par micrometer-registry-prometheus dans le classpath.
# L'exposition ci-dessus suffit à activer GET /actuator/prometheus

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
# /swagger-ui.html → interface interactive
# /v3/api-docs     → spec JSON OpenAPI 3
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =============================================================================
# JWT — Configuration (valeurs réelles dans les profils ou variables d'env)
# =============================================================================
# La clé secrète est injectée via variable d'environnement en production.
# Raison : ne JAMAIS mettre de secret dans le code source ou dans Git.
app.jwt.secret=${JWT_SECRET:dev-secret-key-minimum-256-bits-for-hs256-algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 86400000 ms = 24 heures

# =============================================================================
# RATE LIMITING — protection anti-brute-force de POST /auth/login
# =============================================================================
# Deux compteurs indépendants, par adresse IP :
#   - max-failures / failure-window : verrouillage après N échecs d'auth.
#     Seuls les 401 comptent ; une connexion réussie remet le compteur à zéro.
#   - max-attempts / attempt-window : plafond de débit, succès compris.
#     Protège le CPU — chaque tentative coûte un hash BCrypt de coût 12
#     (~300 ms), donc quelques centaines de requêtes/min suffiraient à saturer
#     les 2 vCPU de l'EC2 sans jamais deviner un mot de passe.
#
# Les compteurs sont LOCAUX (Caffeine), pas dans Redis : un contrôle de
# sécurité ne doit pas s'ouvrir quand un service réseau tombe.
app.rate-limit.login.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.max-failures=${RATE_LIMIT_MAX_FAILURES:5}
app.rate-limit.login.failure-window=${RATE_LIMIT_FAILURE_WINDOW:PT15M}
app.rate-limit.login.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:20}
app.rate-limit.login.attempt-window=${RATE_LIMIT_ATTEMPT_WINDOW:PT1M}

# behind-proxy=true : l'IP client est lue dans X-Real-IP, que NGINX ÉCRASE
# (proxy_set_header X-Real-IP $remote_addr) — donc infalsifiable par le client.
# À passer à false uniquement si le backend est exposé sans reverse proxy,
# sinon toutes les requêtes partageraient la clé de limitation du proxy.
app.rate-limit.behind-proxy=${RATE_LIMIT_BEHIND_PROXY:true}

# =============================================================================
# REDIS — Cache distribué (Phase 11)
# =============================================================================
# Host/port surchargés par les profils ou variables d'environnement.
# Raison : sépare la config de connexion de la logique de cache.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Timeout connexion : 2 s pour ne pas bloquer les requêtes si Redis est absent
spring.data.redis.connect-timeout=2000
spring.data.redis.timeout=2000

# =============================================================================
# KAFKA — Configuration commune (broker surchargé par profil ou variable d'env)
# =============================================================================
# Broker : localhost en dev natif, "kafka" (Docker) via KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer : sérialisation JSON avec en-tête __TypeId__ pour désérialisation typée
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# Consumer : désérialisation JSON guidée par l'en-tête __TypeId__
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Packages de confiance (sécurité : évite la désérialisation de classes arbitraires)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.portfolio.backend.kafka.event
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# =============================================================================
# JACKSON — SÉRIALISATION JSON
# =============================================================================
# Raison : configuration globale de la sérialisation/désérialisation JSON.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# =============================================================================
# LOGS — Configuration de base
# =============================================================================
# Le format JSON est configuré dans application-prod.properties
logging.level.com.portfolio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
