# =============================================================================
# APPLICATION-PROD.PROPERTIES — Configuration production AWS
# =============================================================================
# Activer ce profil : SPRING_PROFILES_ACTIVE=prod (variable K8s ConfigMap)
#
# En prod, on privilégie :
#   - Logs JSON structurés (parsables par ELK, CloudWatch, etc.)
#   - Connexion RDS via variables d'environnement K8s Secrets
#   - Pas de SQL visible dans les logs
#   - Swagger désactivé (ou protégé)
#   - Pool de connexions limité (RDS Free Tier)
#   - CORS restreint au domaine DuckDNS
# =============================================================================

# --- Base de données RDS (injectées par K8s Secrets)
# Raison : les secrets ne doivent JAMAIS être en dur dans ce fichier.
# Kubernetes injecte ces valeurs via des Secrets encodés en base64.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Pool limité pour RDS t3.micro (max 100 connexions PostgreSQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# --- Pas de SQL visible en prod (performance + sécurité)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logs minimalistes en prod (JSON pour les outils de monitoring)
# Raison : les logs JSON sont parsables par CloudWatch, Datadog, etc.
logging.level.com.portfolio=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# --- Actuator : exposer uniquement health et info (sécurité)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Swagger désactivé en prod (ou protégé par auth)
# Pour un portfolio, on peut le laisser activé pour les recruteurs.
# Pour un vrai projet prod, le désactiver :
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=true

# --- CORS : uniquement le domaine de production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://monapp.duckdns.org}

# --- JWT : clé secrète injectée par K8s Secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- SSL/TLS : Spring Boot derrière NGINX Ingress
# On n'active pas SSL dans Spring Boot car c'est NGINX qui termine le TLS.
# Raison : TLS termination au niveau de l'Ingress = plus simple à gérer.
server.forward-headers-strategy=framework
