# =============================================================================
# SONARCLOUD — Configuration projet (monorepo Java + TypeScript)
# =============================================================================
# Projet : https://sonarcloud.io/summary/overall?id=amine77_devsecops-angular-java21-aws
# =============================================================================

sonar.projectKey=amine77_devsecops-angular-java21-aws
sonar.organization=amine77
sonar.projectName=Portfolio DevSecOps — Angular 21 + Spring Boot Java 21

# ---------------------------------------------------------------------------
# Sources & Tests
# ---------------------------------------------------------------------------
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.test.inclusions=**/*.spec.ts

# ---------------------------------------------------------------------------
# Java — Spring Boot 3 / Java 21
# ---------------------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
# JARs des dépendances Maven — élimine le warning "sonar.java.libraries is empty"
sonar.java.libraries=backend/target/dependency/*.jar

# ---------------------------------------------------------------------------
# Coverage
# Backend  : JaCoCo XML généré par mvn verify
# Frontend : lcov.info généré par jest --coverage
# ---------------------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ---------------------------------------------------------------------------
# Exclusions
# Code généré Lombok/MapStruct + artefacts de build
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/coverage/**,\
  **/target/**,\
  backend/src/main/java/com/portfolio/backend/entity/**,\
  backend/src/main/java/com/portfolio/backend/mapper/**,\
  backend/src/main/java/com/portfolio/backend/BackendApplication.java

sonar.coverage.exclusions=\
  backend/src/main/java/com/portfolio/backend/entity/**,\
  backend/src/main/java/com/portfolio/backend/mapper/**,\
  backend/src/main/java/com/portfolio/backend/BackendApplication.java,\
  frontend/src/main.ts,\
  frontend/src/setup-jest.ts,\
  frontend/src/__mocks__/**
