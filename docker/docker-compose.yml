# =============================================================================
# DOCKER COMPOSE — Développement local
# =============================================================================
# Lance tout l'environnement de développement en une commande :
#   docker-compose up -d
#
# Services :
#   - postgres : base de données PostgreSQL locale
#   - backend  : Spring Boot (reload automatique avec DevTools)
#   - frontend : Angular (ng serve avec proxy)
#
# Réseau :
#   - portfolio-network : réseau bridge interne
#   - Les services se parlent par leur nom (ex: backend → postgres:5432)
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL — Base de données locale
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    ports:
      - "5433:5432"          # Accessible depuis l'IDE pour les outils DB (5433 pour éviter conflit)
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistance des données
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend Spring Boot
  # En dev : jar depuis l'image, ou build local
  # ===========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    # Surcharge de l'ENTRYPOINT pour adapter les flags JVM à la machine locale.
    # -Xms64m  : allocation initiale minimale (évite de réserver 256m dès le départ)
    # -Xmx512m : max suffisant pour Spring Boot 3.3 en dev local
    # -XX:TieredStopAtLevel=1 : compilation JIT minimale → démarrage 2x plus rapide
    entrypoint:
      - java
      - "-Xmx512m"
      - "-Xms64m"
      - "-Xss256k"
      - "-XX:+UseG1GC"
      - "-XX:MaxMetaspaceSize=200m"
      # TieredStopAtLevel=1 RETIRÉ : accélère le démarrage mais désactive le JIT C2
      # → BCrypt strength 12 passe de 300ms à 20s sans C2. Inacceptable en runtime.
      - "-Djava.security.egd=file:/dev/./urandom"
      - "-Dspring.profiles.active=dev"
      - "org.springframework.boot.loader.launch.JarLauncher"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_dev
      SPRING_DATASOURCE_USERNAME: portfolio_user
      SPRING_DATASOURCE_PASSWORD: portfolio_pass
      JWT_SECRET: dev-secret-key-minimum-256-bits-for-hmac-sha256-algorithm
      JWT_EXPIRATION_MS: 86400000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      # wget disponible dans Alpine (curl absent de eclipse-temurin:21-jre-alpine)
      # -q : silencieux  -O- : sortie vers stdout  --spider : HEAD seulement
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # Spring Boot sur machine à RAM limitée
    deploy:
      resources:
        limits:
          memory: 768M   # Réduit — 512m heap + 200m metaspace + overhead JVM

  # ===========================================================================
  # Frontend Angular
  # En dev : ng serve avec hot reload
  # ===========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - portfolio-network
    deploy:
      resources:
        limits:
          memory: 128M

# ===========================================================================
# Volumes nommés — persistance des données entre les redémarrages
# ===========================================================================
volumes:
  postgres_data:
    name: portfolio_postgres_data

# ===========================================================================
# Réseau interne Docker
# ===========================================================================
networks:
  portfolio-network:
    name: portfolio-network
    driver: bridge
