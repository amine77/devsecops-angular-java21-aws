# =============================================================================
# DOCKER COMPOSE DEV STACK — Postgres + Prometheus + Grafana
# =============================================================================
# Pour tester l'observabilité avec le backend tournant NATIVEMENT (Maven).
#
# UTILISATION :
#   1. Démarrer la stack de support :
#      docker-compose -f docker/docker-compose.dev-stack.yml up -d
#
#   2. Lancer le backend nativement (depuis la racine du projet) :
#      $env:SPRING_DATASOURCE_URL = "jdbc:postgresql://localhost:5433/portfolio_dev"
#      mvn spring-boot:run -f backend/pom.xml "-Dspring-boot.run.profiles=dev"
#
#   3. Accès :
#      Backend     : http://localhost:8080
#      Actuator    : http://localhost:8080/actuator/prometheus
#      Prometheus  : http://localhost:9090
#      Grafana     : http://localhost:3000  (admin / admin)
#
# ARRÊT :
#   docker-compose -f docker/docker-compose.dev-stack.yml down
#
# RESET données :
#   docker-compose -f docker/docker-compose.dev-stack.yml down -v
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL — Base de données locale
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    ports:
      - "5433:5432"   # Backend natif se connecte sur localhost:5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Prometheus — Scrape le backend natif via host.docker.internal
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      # prometheus-native.yml : target = host.docker.internal:8080 (backend natif)
      - ./prometheus/prometheus-native.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility (Docker Desktop sur Windows/Mac l'a nativement)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # Grafana — Dashboard observabilité
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: portfolio-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - dev-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: portfolio_postgres_data
  prometheus_data:
    name: portfolio_prometheus_data
  grafana_data:
    name: portfolio_grafana_data

networks:
  dev-network:
    name: portfolio-dev-network
    driver: bridge
