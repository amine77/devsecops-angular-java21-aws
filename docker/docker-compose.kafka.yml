# =============================================================================
# DOCKER COMPOSE KAFKA — Broker Kafka KRaft (sans Zookeeper) + Kafka UI
# =============================================================================
#
# Utilisation (avec la stack principale) :
#   docker-compose -f docker-compose.yml \
#     -f docker-compose.observability.yml \
#     -f docker-compose.kafka.yml up -d
#
# Ou standalone :
#   docker-compose -f docker-compose.kafka.yml up -d
#
# Accès :
#   Kafka broker  : localhost:9092 (depuis l'hôte)
#   Kafka UI      : http://localhost:8090
#
# Architecture KRaft (Kafka 3.8 — sans Zookeeper) :
#   Le broker joue aussi le rôle de controller.
#   Mode single-node adapté au développement local.
#   En production : 3 brokers + 3 controllers séparés.
#
# Topics créés automatiquement par Spring Boot (KafkaAdmin) :
#   auth-events     — événements d'authentification (login success/failure)
#   project-events  — événements de gestion de projets (création, mise à jour)
# =============================================================================

services:

  # ===========================================================================
  # Kafka — Broker KRaft (mode développement, single-node)
  # ===========================================================================
  kafka:
    image: apache/kafka:3.8.1
    container_name: portfolio-kafka
    restart: unless-stopped
    environment:
      # --- Identité du nœud KRaft
      KAFKA_NODE_ID: 1
      # Ce nœud est à la fois broker (sert les clients) et controller (consensus)
      KAFKA_PROCESS_ROLES: broker,controller

      # --- Listeners réseau
      # PLAINTEXT : communication avec les clients (producers/consumers)
      # CONTROLLER : communication interne KRaft entre controllers
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Adresse annoncée AUX CLIENTS depuis l'intérieur du réseau Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Quorum KRaft (un seul controller en dev)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Configuration des topics internes (réplication = 1 en dev)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # --- Performance dev : pas d'attente avant premier rebalance
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Rétention des messages : 24h en dev (évite de remplir le disque)
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 52428800   # 50 MB

      # --- Cluster ID fixe (doit être un UUID base64 valide de 22 chars)
      # Raison : stabilité des restarts en dev (KRaft requiert un ID constant)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

      # --- Création automatique des topics (pratique en dev)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"    # Accessible depuis l'hôte (IDE, outils externes)
    networks:
      - portfolio-network
    healthcheck:
      # Vérifie que le broker répond en listant les topics
      test: ["CMD-SHELL",
             "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s   # KRaft nécessite ~20s pour initialiser le quorum
    deploy:
      resources:
        limits:
          memory: 512M   # Suffisant pour un broker dev single-node

  # ===========================================================================
  # Kafka UI — Interface web pour visualiser topics, messages, consumer groups
  # ===========================================================================
  # Raison portfolio : démontre visuellement le flux d'événements en temps réel.
  # Accès : http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: portfolio-kafka-ui
    restart: unless-stopped
    environment:
      # Connexion au broker Kafka (par nom de service Docker)
      KAFKA_CLUSTERS_0_NAME: portfolio-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      # Désactiver la collecte de données d'usage
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - portfolio-network
    deploy:
      resources:
        limits:
          memory: 256M

# ===========================================================================
# Réseau — partage avec docker-compose.yml principal
# ===========================================================================
networks:
  portfolio-network:
    name: portfolio-network
    external: true
