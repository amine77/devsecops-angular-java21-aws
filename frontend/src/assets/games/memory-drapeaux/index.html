<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory des Drapeaux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>🧠 Memory des Drapeaux</h1>

    <div class="scoreboard">
      <div class="player active" id="player1">
        <span class="name">Joueur 1</span>
        <span class="score" id="score1">0</span>
      </div>
      <div class="turn-indicator" id="turnIndicator">Au tour de Joueur 1</div>
      <div class="player" id="player2">
        <span class="name">Joueur 2</span>
        <span class="score" id="score2">0</span>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button id="restartBtn">🔄 Nouvelle partie</button>
    </div>
  </div>

  <div class="modal hidden" id="winModal">
    <div class="modal-content">
      <h2 id="winText"></h2>
      <button id="playAgainBtn">Rejouer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
