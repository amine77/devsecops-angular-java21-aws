# =============================================================================
# NGINX Configuration — Serveur de fichiers statiques Angular
# =============================================================================
# Ce fichier configure NGINX pour servir l'application Angular.
#
# Fonctionnalités configurées :
# - SPA routing (toutes les routes → index.html)
# - Gzip compression
# - Cache headers optimisés
# - Headers de sécurité
# - Proxy vers le backend (optionnel si Ingress gère le routing)
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # COMPRESSION GZIP
    # Réduit la taille des fichiers transférés (JS, CSS, HTML) de ~70%
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "msie6";

    # =========================================================================
    # HEADERS DE SÉCURITÉ
    # Protection contre les attaques XSS, Clickjacking, etc.
    #
    # PIÈGE NGINX : un add_header dans un bloc "location" ANNULE tous les
    # add_header hérités du niveau "server". Les locations qui définissent
    # leurs propres headers (cache) doivent donc REDÉCLARER ces headers.
    #
    # X-XSS-Protection : retiré (déprécié, ignoré par les navigateurs modernes,
    # la protection XSS réelle vient de la CSP ci-dessous).
    #
    # CSP en mode Report-Only : observe les violations dans la console
    # navigateur sans rien bloquer. À passer en "Content-Security-Policy"
    # (enforcing) après quelques jours sans violation légitime.
    #   - script-src 'self'        : Angular AOT n'a pas de script inline
    #   - style-src 'unsafe-inline': requis par Angular (styles composants
    #                                injectés) et GSAP (styles inline)
    #   - img-src https:           : les images de projets sont des URLs
    #                                externes saisies en admin (S3, etc.)
    #   - connect-src 'self'       : API same-origin (/api) + i18n (/assets)
    # =========================================================================
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $csp always;

    # =========================================================================
    # CACHE DES ASSETS STATIQUES
    # Les fichiers avec hash dans le nom (style.abc123.js) sont immuables.
    # Angular ajoute un hash au build production → safe to cache forever.
    # =========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Redéclaration obligatoire (add_header local annule l'héritage)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp always;
    }

    # =========================================================================
    # SPA ROUTING — mini-projets React embarqués (ex: jeux, démos)
    # Ces apps ont leur propre router côté client avec un "basename" dédié.
    # Sans cette règle, un refresh sur /assets/games/learn-english/cartes
    # retomberait sur le location / ci-dessous et servirait l'index.html
    # de l'Angular du portfolio au lieu de celui du mini-projet.
    # =========================================================================
    location /assets/games/learn-english/ {
        try_files $uri $uri/ /assets/games/learn-english/index.html;
    }

    # =========================================================================
    # SPA ROUTING — Angular Router
    # Toutes les requêtes qui ne correspondent pas à un fichier existant
    # sont redirigées vers index.html.
    # Raison : Angular gère le routing côté client.
    # Sans cette règle, un refresh sur /portfolio/projects donnerait 404.
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Redéclaration obligatoire (add_header local annule l'héritage)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp always;
    }

    # =========================================================================
    # PROXY API → Backend Spring Boot
    # Toutes les requêtes /api/* sont proxiées vers le backend.
    # Le préfixe /api est supprimé avant transmission (trailing slash).
    # Ex : /api/auth/login → http://backend:8080/auth/login
    #
    # En local Docker Compose : "backend" = nom du service (réseau bridge interne)
    # En Kubernetes : l'Ingress gère ce routing (pas NGINX frontend)
    # =========================================================================
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # HEALTH CHECK pour Kubernetes
    # Retourne 200 pour les probes Kubernetes readiness/liveness
    # =========================================================================
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Pas de logs pour favicon (évite de polluer les logs)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Cacher les fichiers .htaccess etc.
    location ~ /\.ht {
        deny all;
    }
}
