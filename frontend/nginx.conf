# =============================================================================
# NGINX Configuration — Serveur de fichiers statiques Angular
# =============================================================================
# Ce fichier configure NGINX pour servir l'application Angular.
#
# Fonctionnalités configurées :
# - SPA routing (toutes les routes → index.html)
# - Gzip compression
# - Cache headers optimisés
# - Headers de sécurité
# - Proxy vers le backend (optionnel si Ingress gère le routing)
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # COMPRESSION GZIP
    # Réduit la taille des fichiers transférés (JS, CSS, HTML) de ~70%
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "msie6";

    # =========================================================================
    # HEADERS DE SÉCURITÉ
    # Protection contre les attaques XSS, Clickjacking, etc.
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # =========================================================================
    # CACHE DES ASSETS STATIQUES
    # Les fichiers avec hash dans le nom (style.abc123.js) sont immuables.
    # Angular ajoute un hash au build production → safe to cache forever.
    # =========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================================================
    # SPA ROUTING — Angular Router
    # Toutes les requêtes qui ne correspondent pas à un fichier existant
    # sont redirigées vers index.html.
    # Raison : Angular gère le routing côté client.
    # Sans cette règle, un refresh sur /portfolio/projects donnerait 404.
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # =========================================================================
    # HEALTH CHECK pour Kubernetes
    # Retourne 200 pour les probes Kubernetes readiness/liveness
    # =========================================================================
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Pas de logs pour favicon (évite de polluer les logs)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Cacher les fichiers .htaccess etc.
    location ~ /\.ht {
        deny all;
    }
}
