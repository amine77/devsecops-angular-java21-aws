apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  labels:
    app: infrastructure
    component: secrets-management
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 0 : ESO doit être installé AVANT le ClusterSecretStore (wave 1)
    # et les ExternalSecrets (wave 2)
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  # Source : chart Helm officiel External Secrets (external-secrets.io)
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.x"    # Version mineure fixée, patchs auto
    helm:
      # Valeurs allégées pour t3.micro (1GB RAM + SWAP)
      values: |
        # Installer les CRDs automatiquement
        installCRDs: true

        # Controller ESO
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"

        # Webhook (validation des ExternalSecret)
        webhook:
          resources:
            requests:
              memory: "16Mi"
              cpu: "5m"
            limits:
              memory: "32Mi"
              cpu: "50m"

        # Cert Controller (certificats TLS internes ESO)
        certController:
          resources:
            requests:
              memory: "16Mi"
              cpu: "5m"
            limits:
              memory: "32Mi"
              cpu: "50m"

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # Requis pour les CRDs volumineuses d'ESO
